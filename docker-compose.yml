services:
  # ==========================================
  # 1. Database (MySQL)
  # ==========================================
  db:
    image: mysql:8.0
    container_name: secure_schedule_db
    restart: always
    environment:
      # Pulls DB_PASSWORD from the .env file. Defaults to '1234' if not found.
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
      MYSQL_DATABASE: main_backend_db
    ports:
      - "3306:3306" # Exposes port 3306 to the host for local development & DataGrip
    networks:
      - db_network
    volumes:
      - db_data:/var/lib/mysql

  # ==========================================
  # 2. Main Backend (Spring Boot) - Currently Commented Out
  # Running locally via IntelliJ for development
  # ==========================================
  #  main-backend:
  #    build:
  #      context: ./main-backend
  #      dockerfile: Dockerfile
  #    container_name: secure_schedule_main
  #    restart: always
  #    ports:
  #      - "8080:8080"
  #    depends_on:
  #      - db
  #    environment:
  #      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/main_backend_db?createDatabaseIfNotExist=true&serverTimezone=UTC
  #      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
  #      - JWT_SECRET=${JWT_SECRET}
  #    networks:
  #      - frontend_network
  #      - db_network
  #      - algo_network

  # ==========================================
  # 3. Algorithm Sandbox (Isolated Side-Backend)
  # ==========================================
  side-backend:
    build:
      context: .
      dockerfile: Dockerfile.side-backend
    container_name: secure_schedule_algo
    restart: always
    # Using 'ports' instead of 'expose' so the host machine (IntelliJ) can send DTOs to it.
    # It remains stateless and has NO direct connection to the database.
    ports:
      - "8081:8081"
    environment:
      - INTERNAL_KEY=${INTERNAL_KEY:-dev-key}
    networks:
      - algo_network

  # ==========================================
  # 4. Frontend (React + Nginx) - Currently Commented Out
  # ==========================================
#  frontend:
#    build:
#      context: ./frontend
#      dockerfile: Dockerfile
#    container_name: secure_schedule_frontend
#    restart: always
#    ports:
#      - "80:80"
#    depends_on:
#      - main-backend
#    networks:
#      - frontend_network

# ==========================================
# Security Networks (Zero-Trust Segmentation)
# ==========================================
networks:
  frontend_network:
    driver: bridge
  db_network:
    driver: bridge
    # internal: true # Uncomment in production to completely block internet access
  algo_network:
    driver: bridge
    # internal: true # Uncomment in production to fully isolate the Sandbox

# ==========================================
# Persistent Volumes
# ==========================================
volumes:
  db_data: # Ensures DB data is retained when containers stop