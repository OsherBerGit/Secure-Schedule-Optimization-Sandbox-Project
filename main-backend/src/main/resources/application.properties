spring.application.name=main-backend

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/main_backend_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=8080

# JWT Configuration
# IMPORTANT: In production, use environment variable: JWT_SECRET
# Generate a secure key: openssl rand -base64 32
jwt.secret=${JWT_SECRET:default-dev-secret-key-change-in-production-min-32-chars}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# Enable scheduling for token cleanup
spring.main.allow-bean-definition-overriding=true

# Development Mode
# Set to false in production to enable full authentication/authorization
app.development-mode=true

# Algorithm service URL
algorithm.service.url=http://localhost:8081

